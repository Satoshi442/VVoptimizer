name: Build VV Optimizer

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Package
        run: |
          mkdir -p dist/VVOptimizer
          cp build/libvv_optimizer.so manifest.json dist/VVOptimizer/

          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
            dist/VVOptimizer/libvv_optimizer.so

          (cd dist && zip -r VVOptimizer.zip VVOptimizer)

      - uses: actions/upload-artifact@v4
        with:
          name: VVOptimizer
          path: dist/VVOptimizer/

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VVOptimizer.zip
