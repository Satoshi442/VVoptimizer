name: Build VV Optimizer

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            unzip

      - name: Install Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r29
        run: |
          sdkmanager --install "ndk;29.0.13113456"

      - name: Configure
        run: |
          cmake -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24

      - name: Build
        run: |
          cmake --build build --config Release -j2

      - name: Find output
        run: |
          find build -type f \( -name "*.so" -o -name "*.levipack" \) -print

      - name: Package
        run: |
          mkdir -p artifact
          find build -type f -name "*.so" -exec cp {} artifact/ \;
          cp manifest.json artifact/ 2>/dev/null || true
          cd artifact
          zip -r ../VVOptimizer-Android.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VVOptimizer-Android
          path: VVOptimizer-Android.zip
